name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Las pruebas cubren las reglas de calidad (pandas); no requieren SQL Server.
      - run: pip install pandas pytest
      - run: pytest -v
